{% extends "base.html" %}
{% block title %}{{ error_title }} | Flow Mate{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:760px;min-height:45vh">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
        <div class="text-danger fs-1 mb-3"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h1 class="h3 fw-bold">{{ error_title }}</h1>
        <p class="text-secondary">{{ error_message }}</p>
        <div class="d-flex flex-wrap gap-2 mt-2">
            <a href="{{ url_for('dashboard') if session.get('user_id') else url_for('home') }}" class="btn btn-success">Return to Flow Mate</a>
            <a href="javascript:location.reload()" class="btn btn-outline-secondary">Try again</a>
        </div>
    </div>
</div>
{% endblock %}
