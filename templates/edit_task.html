{% extends "base.html" %}

{% block title %}
Edit Task
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-lg p-4">

                <h2 class="mb-4 text-center">
                    ✏️ Edit Task
                </h2>

                <form action="/update_task/{{ task.id }}" method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Task Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            value="{{ task.title }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4">{{ task.description }}</textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Priority
                        </label>

                        <select
                            name="priority"
                            class="form-select">

                            <option value="High"
                            {% if task.priority=="High" %}selected{% endif %}>
                            High
                            </option>

                            <option value="Medium"
                            {% if task.priority=="Medium" %}selected{% endif %}>
                            Medium
                            </option>

                            <option value="Low"
                            {% if task.priority=="Low" %}selected{% endif %}>
                            Low
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Due Date
                        </label>

                        <input
                            type="date"
                            name="due_date"
                            class="form-control"
                            value="{{ task.due_date }}">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select">

                            <option value="Pending"
                            {% if task.status=="Pending" %}selected{% endif %}>
                            Pending
                            </option>

                            <option value="Completed"
                            {% if task.status=="Completed" %}selected{% endif %}>
                            Completed
                            </option>

                        </select>

                    </div>

                    <button class="btn btn-success">
                        💾 Update Task
                    </button>

                    <a href="/tasks" class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
