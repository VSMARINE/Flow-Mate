{% extends "base.html" %}

{% block title %}

Register

{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow-lg border-0 rounded-4">

<div class="card-body p-5">

<h2 class="text-center mb-4">

<i class="fas fa-user-plus text-success"></i>

Create Account

</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">

Full Name

</label>

<input
type="text"
name="fullname"
class="form-control form-control-lg"
required>

</div>

<div class="mb-3">

<label class="form-label">

Email

</label>

<input
type="email"
name="email"
class="form-control form-control-lg"
required>

</div>

<div class="mb-3">

<label class="form-label">

Username

</label>

<input
type="text"
name="username"
class="form-control form-control-lg"
required>

</div>

<div class="mb-4">

<label class="form-label">

Password

</label>

<input
type="password"
name="password"
class="form-control form-control-lg"
required>

</div>

<div class="d-grid">

<button class="btn btn-success btn-lg">

<i class="fas fa-user-check"></i>

Create Account

</button>

</div>

</form>

<hr>

<p class="text-center">

Already have an account?

<a href="/login">

Login

</a>

</p>

</div>

</div>

</div>

</div>

{% endblock %}
