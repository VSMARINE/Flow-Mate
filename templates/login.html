{% extends "base.html" %}

{% block title %}

Login

{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow-lg border-0 rounded-4">

<div class="card-body p-5">

<h2 class="text-center mb-4">

<i class="fas fa-user-circle text-primary"></i>

Welcome Back

</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">

Username

</label>

<input
type="text"
name="username"
class="form-control form-control-lg"
required>

</div>

<div class="mb-4">

<label class="form-label">

Password

</label>

<input
type="password"
name="password"
class="form-control form-control-lg"
required>

</div>

<div class="d-grid">

<button class="btn btn-primary btn-lg">

<i class="fas fa-sign-in-alt"></i>

Login

</button>

</div>

</form>

<hr>

<p class="text-center">

Don't have an account?

<a href="/register">

Register

</a>

</p>

</div>

</div>

</div>

</div>

{% endblock %}
